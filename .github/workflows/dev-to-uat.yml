name: 2. Promote Dev → UAT

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number that was merged into dev"
        required: true
        type: number
      source_branch:
        description: "Source branch: dev"
        required: true
        type: choice
        options:
          - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Git and tools
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR exists, is merged, and targeted dev
        id: validate
        run: |
          PR="${{ github.event.inputs.pr_number }}"

          if [ -z "$PR" ]; then
            echo "Error: PR number cannot be empty." >&2
            exit 1
          fi

          PR_JSON=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}")

          ERR=$(echo "$PR_JSON" | jq -r '.message // empty')
          if [ -n "$ERR" ]; then
            echo "Error: PR #$PR not found. API message: $ERR" >&2
            exit 1
          fi

          BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.base.ref')
          MERGED=$(echo "$PR_JSON" | jq -r '.merged')

          if [ "$MERGED" != "true" ]; then
            echo "Error: PR #$PR is not merged." >&2
            exit 1
          fi

          if [ "$BASE_BRANCH" != "dev" ]; then
            echo "Error: PR #$PR must have been merged into dev (found: $BASE_BRANCH)." >&2
            exit 1
          fi

          LAST_SHA=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${P
